
name: Lab 5 CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: queue_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: restaurant_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queue_user -d restaurant_queue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://queue_user:ci_test_password@127.0.0.1:5432/restaurant_queue_dev
      TEST_DATABASE_URL: postgresql://queue_user:ci_test_password@127.0.0.1:5432/restaurant_queue_test
      NODE_ENV: test
      TZ: UTC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run db:generate

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Run server unit tests
        working-directory: server
        run: npm run test:unit

      - name: Run server API tests
        working-directory: server
        run: npm run test:api

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Run client UI tests
        working-directory: client
        run: npm run test:ui

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t restaurant-queue-server:ci .

      - name: Build frontend Docker image
        run: docker build -f client/Dockerfile -t restaurant-queue-client:ci .
